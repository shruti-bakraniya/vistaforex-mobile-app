name: vistaforex
description: "VistaForex — Premium Flutter currency converter with glassmorphism UI, GetX MVVM, and real-time exchange rates."
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3                       # State management & navigation
  dio: ^5.9.2                       # HTTP client with interceptors
  fl_chart: ^1.2.0                  # Interactive charts
  shared_preferences: ^2.5.5        # Local key-value persistence
  connectivity_plus: ^7.1.1         # Network connectivity detection
  intl: ^0.20.2                     # Number & date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
